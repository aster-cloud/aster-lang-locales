name: Release

# 在 v* tag 上把三个 first-party 语言包（en/zh/de）发布到 GitHub Packages
# （ADR-0011 合并仓）。坐标是本仓自有的
# cloud.aster-lang:aster-lang-locales-{en,zh,de}（locales/*/build.gradle.kts），
# **不是**已归档独立仓的 aster-lang-{en,zh,de}——GitHub Packages 对那些包名返回
# 422，无法从本仓重发（见下方 per-pack publish step 的说明）。
#
# Layout mirrors ci.yml: this repo checks out into aster-lang-locales/ and
# aster-lang-core / aster-lang-platform check out as siblings so the
# verifyLexiconParity / verifyLexiconKeywordParity gates can resolve the core
# backbone at ../../../aster-lang-core (relative to locales/<id>/).

on:
  push:
    tags: ['v*']
  # orchestrator 入口：dispatch 只创建 tag（CROSS_REPO_TOKEN/PAT），真正发布走 tag-push。
  # 本仓双制品：Maven lexicon(catalog-derived=asterLang) + npm @aster-cloud/ui-messages
  # (literal)。tag 代表主 release line = Maven/catalog version；npm version 由 publish
  # 内部 gate 单独校验，不和 tag 比。详见 ADR 0023 阶段2。
  workflow_dispatch:
    inputs:
      version:
        description: 'Maven/catalog 主版本（不含 v；= release-plan ecosystemVersion）'
        required: false
        type: string
      package:
        description: "填 'ui-messages' 走 npm-only 独立发布，不建 tag/不发 Maven"
        required: false
        type: string
      artifactIds:
        required: false
        type: string
      trainId:
        required: false
        type: string
      forceTests:
        description: '发布 run 跑完整测试而不要求 main CI 已通过（ADR 0053 修订 A2 的逃生口）'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}-${{ inputs.package && format('npm-{0}', inputs.package) || (inputs.version && format('v{0}', inputs.version) || github.ref_name) }}
  cancel-in-progress: false

jobs:
  # dispatch 路径：仅创建 tag。catalog-derived 版本用 Gradle 解析（不能 sed 字面量）。
  create-tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package != 'ui-messages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      # catalog 来自 cloud.aster-lang:aster-lang-platform（GH Packages），但 settings
      # 只声明 mavenLocal()+mavenCentral()。干净 runner 无法在 settings 评估阶段解析
      # catalog → 先 checkout platform 并 publishToMavenLocal（同 publish job 的 bootstrap），
      # 之后本仓 Gradle 才能解析 catalog-derived version。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      # aster-lang-platform#138：JDK + Gradle 依赖缓存（先恢复再解析；列车 dispatch 跑在 main，本组缓存读写），并把
      # gradle-retry.sh（Maven Central 429 时退避重试）/ gradle-version.sh 加进 PATH。须在全部 checkout 之后。
      - uses: aster-cloud/aster-lang-platform/.github/actions/setup-gradle-cached@main
        with:
          cache-group: release
      - name: Bootstrap version catalog to Maven Local
        run: cd aster-lang-platform && gradle-retry.sh ./gradlew publishToMavenLocal
      - name: Verify version & create tag
        env:
          VERSION: ${{ inputs.version }}
          FORCE_TESTS: ${{ inputs.forceTests }}
        run: |
          # catalog-derived：version = asterLibs.findVersion("asterLang")。用 Gradle 解析
          # 实际 project version（:en 子项目代表整组），不读字面量。
          if [ -z "$VERSION" ]; then
            echo "::error::workflow_dispatch catalog release requires input 'version' (npm-only uses package=ui-messages)"
            exit 1
          fi
          # Gradle 失败（限流重试用尽也算）或读不到版本时 gradle-version.sh 退出非 0，本步在赋值处终止，不会拿空串去比（#138）。
          RESOLVED=$(gradle-version.sh . :en:properties)
          if [ "$VERSION" != "$RESOLVED" ]; then
            echo "::error::dispatch version ($VERSION) != Gradle-resolved catalog version ($RESOLVED)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n1 "$TAG"); HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              # ADR 0053 修订 A2：tag 已在本 commit 上时 dispatch 是 no-op，tag 消息不会再变；本次要求 forceTests 而已有
              # tag 不带标记，就明确失败，不让 forceTests 被静默忽略。
              if [ "$FORCE_TESTS" = "true" ] && ! git cat-file -p "refs/tags/$TAG" | grep -qxF "release-gate: force-tests"; then
                echo "::error::$TAG 已存在但不带 force-tests 标记，本次 forceTests=true 不会生效。该版本尚未发布时：删除远端 tag（git push origin :refs/tags/$TAG）后重新 dispatch；或让 main CI 变绿后重跑该 tag 的 publish run。"; exit 1
              fi
              echo "::notice::$TAG already on this commit → no-op (idempotent)"; exit 0
            fi
            echo "::error::$TAG exists but points to $TAG_SHA, not HEAD $HEAD_SHA"; exit 1
          fi
          # ADR 0053 修订 A2：forceTests 时打 annotated tag，消息带标记，tag-push 的发布 run 据此跑完整测试。
          if [ "$FORCE_TESTS" = "true" ]; then
            git tag -a "$TAG" -m "release-gate: force-tests"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

  # npm-only 路径：ui-messages 版本是 package.json literal，独立 cadence。此前它只能搭
  # catalog v* tag 顺车发布，导致 catalog 不前进时 npm 新版本无入口；本 job 在同一 workflow
  # 内使用 OIDC Trusted Publisher，只发布公共 npm 包，不建 tag、不跑 Maven guard、不发 lexicon。
  publish-ui-messages-npm:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.package == 'ui-messages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC Trusted Publishing：npmjs.com 配的是本仓 + 本 workflow，本 job 必须留在 release.yml。
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: aster-lang-locales

      # exportUiMessages 走 Gradle；settings.gradle.kts 需要 platform catalog 先进入 Maven Local。
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-core
          path: aster-lang-core
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # Maven Central 限流（429）防护：此后的 Gradle 构建优先走 Central 镜像，缺货回落原仓库（制品逐字节相同）。
      - uses: aster-cloud/aster-lang-platform/.github/actions/maven-central-mirror@main

      - name: Publish version catalog to Maven Local
        working-directory: aster-lang-platform
        run: ./gradlew publishToMavenLocal

      - name: Publish core to Maven Local
        working-directory: aster-lang-core
        run: ./gradlew publishToMavenLocal -x test

      - name: Export ui-messages manifest (parity-gated)
        working-directory: aster-lang-locales
        run: ./gradlew exportUiMessages

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@aster-cloud'

      - name: Publish @aster-cloud/ui-messages to public npm (Trusted Publisher)
        working-directory: aster-lang-locales/ui-messages
        run: |
          set -o pipefail
          if npm publish --provenance --access public 2>&1 | tee /tmp/npm.log; then
            echo "ui-messages published"
          elif grep -q "cannot publish over the previously published versions" /tmp/npm.log; then
            echo "ui-messages 同版本已发布，跳过（幂等）"
          else
            echo "npm publish 真失败"; exit 1
          fi

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # ADR 0053 修订 A2：main CI 门禁读本仓的 CI run 与 job。
      actions: read
      contents: read
      packages: write
      # OIDC Trusted Publishing：@aster-cloud/ui-messages 发公共 npm 用 OIDC
      # （同 @aster-cloud/aster-lang-ts，无 NPM_TOKEN）。需在 npmjs.com 为该包配置
      # Trusted Publisher（关联本仓 + 本 workflow）。
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: aster-lang-locales

      # ADR 0053 修订 A2：发布的 commit 必须已在 main CI 上通过，发布 run 不再重跑测试。
      # 必需 job 见 .github/main-ci-gate.json；tag 带「release-gate: force-tests」时门禁跳过、本 run 跑完整测试。
      - name: Require main CI green for this commit
        id: ci-gate
        uses: aster-cloud/aster-lang-platform/.github/actions/require-main-ci-green@main
        with:
          config: aster-lang-locales/.github/main-ci-gate.json

      # Shared version catalog (aster-lang-platform, ADR 0012) — settings.gradle
      # imports it; must land in Maven Local before any module build resolves
      # asterLibs.*.
      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      - uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-core
          path: aster-lang-core
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}

      # aster-lang-platform#138：JDK + gradle-retry.sh / gradle-version.sh。缓存仍用 setup-java 的 `cache: gradle`：
      # 键只由构建文件决定，tag run 精确命中 main CI 写下的完整依赖缓存。
      - uses: aster-cloud/aster-lang-platform/.github/actions/setup-gradle-cached@main
        with:
          cache: setup-java

      # 版本目录（platform）必须先进 mavenLocal —— settings.gradle.kts 通过
      # from("...aster-lang-platform:X") 导入它；否则后续任何 Gradle 调用（含下方
      # Verify 的 :en:properties）都无法解析 catalog → 配置失败 → 空 version。
      # （此前 Verify 在本步之前，CI 上 :en:properties 拿到空版本号，guard 误判。）
      - name: Publish version catalog to Maven Local
        working-directory: aster-lang-platform
        run: gradle-retry.sh ./gradlew publishToMavenLocal

      - name: Publish core to Maven Local
        working-directory: aster-lang-core
        run: gradle-retry.sh ./gradlew publishToMavenLocal -x test

      # Tag↔version guard: the v* tag must match the version the subprojects
      # publish (subprojects { version = ... } in build.gradle.kts). Stops a
      # mistagged release from publishing the wrong GAV.
      - name: Verify tag matches project version
        working-directory: aster-lang-locales
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Gradle 失败（限流重试用尽也算）或读不到版本时 gradle-version.sh 退出非 0，本步在赋值处终止，不会拿空串去比（#138）。
          PROJECT_VERSION="$(gradle-version.sh . :en:properties)"
          echo "tag=$TAG  projectVersion=$PROJECT_VERSION"
          if [ "$TAG" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG does not match project version $PROJECT_VERSION. Bump build.gradle.kts or fix the tag."
            exit 1
          fi

      # 测试已在 main CI 上对本 commit 通过（上面的门禁），这里只构建与打包：check 里的 parity /
      # 夹具 / schema 校验任务（verifyLexiconParity、verifyUiMessagesParity、verifyCoreIrSchema 等）照跑，
      # 它们针对本次 tag 的兄弟仓源码校验制品内容。force-tests 时跑完整 build（含 test）。
      - name: Build (all 3 modules; tests ran in main CI)
        working-directory: aster-lang-locales
        env:
          FORCE_TESTS: ${{ steps.ci-gate.outputs.force-tests }}
        run: |
          if [ "$FORCE_TESTS" = "true" ]; then ./gradlew build; else ./gradlew build -x test; fi

      # jar 级冒烟：三个语言包主 jar 存在、版本与 tag 一致、带 SPI 注册与语言包类。
      - name: Verify jar contents
        uses: aster-cloud/aster-lang-platform/.github/actions/verify-jar-contents@main
        with:
          working-directory: aster-lang-locales
          jars: |
            locales/en/build/libs/*.jar
            locales/zh/build/libs/*.jar
            locales/de/build/libs/*.jar
          version: ${{ github.ref_name }}
          entries: |
            ^META-INF/services/
            ^aster/lang/.*\.class$

      # 发布 lexicon SPI 包到 GitHub Packages Maven —— **新坐标**
      # cloud.aster-lang:aster-lang-locales-{en,zh,de}。
      # 老坐标 cloud.aster-lang:aster-lang-{en,zh,de} 归属已归档的 aster-lang-en/zh/de
      # 仓（GitHub Packages 包名按首发仓归属，从本仓发同名包 → 422）。ADR 0011 的
      # "发布层接管"因此在 Maven 通道从未落地。现迁到 locales 自有的新坐标（同 hi 用
      # 独立坐标 aster-lang-hi 的先例），彻底脱离归档仓 → 随生态版本级联无阻。
      # 逐包独立发布 + 幂等容忍：GH Packages Maven 对已存在的 release 版本重发返
      # 409 Conflict。三个包合在一条 gradle 命令里时，任一已存在会让整条失败，导致
      # 其余包补不上（曾发生：1.0.5 时 en 落了、zh/de 因瞬时失败没落，之后重发因 en
      # 已存在而整体 409 → zh/de 永远补不上）。改为每包独立发布，且把 409
      # "already exists" 当幂等 no-op，让重跑能自愈、补齐缺失的包。
      - name: Publish lexicon packs to GitHub Packages (idempotent, per-pack)
        working-directory: aster-lang-locales
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          publish_pack() {
            local proj="$1"
            if ./gradlew "${proj}:publish" 2>&1 | tee /tmp/pub.log; then
              echo "::notice::${proj} published"
            elif grep -qiE "received status code 409|already exists|Conflict" /tmp/pub.log; then
              echo "::notice::${proj} 该版本已存在 → 幂等跳过"
            else
              echo "::error::${proj} publish 真失败"; return 1
            fi
          }
          fail=0
          for p in :en :zh :de; do publish_pack "$p" || fail=1; done
          [ "$fail" = "0" ] || { echo "::error::至少一个 lexicon 包发布真失败"; exit 1; }

      # ── ui-messages manifest npm 通道（ADR 0018 统一语言包 Phase 1）──
      # 界面文案聚合产物走独立 npm 包(@aster-cloud/ui-messages)，不进 JVM jar。
      # 发到**公共 npm**（与 @aster-cloud/aster-lang-ts/tokens 同 registry），
      # 让 aster-cloud 的 CI + Cloudflare Workers 构建免 GitHub Packages 认证即可消费。
      # exportUiMessages 由上面的 `build` 已跑过(parity 校验亦在其中)；prepack
      # 再跑一次确保产物最新，然后 npm publish。
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@aster-cloud'

      # 经 OIDC Trusted Publisher 发布（--provenance），无 token。幂等：同版本已发布
      # 时 npm 报 "cannot publish over the previously published versions" 非真失败
      # （重跑 release / 只改 Maven 坐标时 ui-messages 版本未变），容忍之。
      # 注意用 `set -o pipefail` 让 npm 的非零退出穿透 tee，避免真失败被 tee 掩盖。
      - name: Publish @aster-cloud/ui-messages to public npm (Trusted Publisher)
        working-directory: aster-lang-locales/ui-messages
        run: |
          set -o pipefail
          if npm publish --provenance --access public 2>&1 | tee /tmp/npm.log; then
            echo "ui-messages published"
          elif grep -q "cannot publish over the previously published versions" /tmp/npm.log; then
            echo "ui-messages 同版本已发布，跳过（幂等）"
          else
            echo "npm publish 真失败"; exit 1
          fi
